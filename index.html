<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>PyThermal AI</title></head><body><main><header><h1>🔥 PyThermal AI</h1><p>Visible-light thermal simulation · NOT a thermometer</p></header><section class="viewer"><video id="camera" autoplay playsinline muted hidden></video><canvas id="view" aria-label="Simulated thermal camera"></canvas><div id="status" role="status">Tap Start Camera to begin</div></section><section class="controls"><button id="start">Start Camera</button><button id="flip">Flip Camera</button><button id="save">Save PNG</button><label>Palette <select id="palette"><option value="rainbow">Rainbow</option><option value="iron">Iron</option><option value="gray">Grayscale</option></select></label><label>Brightness <input id="brightness" type="range" min="-100" max="100" value="0"></label><label>Contrast <input id="contrast" type="range" min="50" max="200" value="100"></label></section><p class="warning">⚠️ Colors represent visible brightness, NOT real heat or temperature. Do not use for medical or safety decisions.</p></main><script src="app.js"></script></body></html>
