name: Deploy PyThermal AI PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate source and generate icons
        run: |
          node --check app.js
          python3 -m py_compile server.py generate-icons.py
          python3 -m json.tool manifest.json > /dev/null
          if [ -f brand/pythermal-logo.png ]; then
            python3 -m pip install --quiet Pillow
            python3 brand/make-icons.py
          else
            python3 generate-icons.py
          fi
          test -s icon-192.png
          test -s icon-512.png
      - name: Prepare static distribution
        run: |
          mkdir -p _site
          cp index.html style.css app.js manifest.json sw.js icon.svg icon-192.png icon-512.png _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
